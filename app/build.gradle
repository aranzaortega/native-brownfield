apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"

def nodeModulesExist = new File(rootDir, "node_modules/react-native").exists()
if (nodeModulesExist) {
    try {
        apply plugin: "com.facebook.react"
    } catch (Exception e) {
        logger.warn("React Gradle plugin not applied: " + e.message)
    }
}

android {
    namespace "com.example.nativebrownfield"
    compileSdk rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "com.example.nativebrownfield"
        minSdk rootProject.ext.minSdkVersion
        targetSdk rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        buildConfig true
    }
}

dependencies {
    implementation("androidx.core:core-ktx:1.12.0")
    implementation("androidx.appcompat:appcompat:1.6.1")
    implementation("com.google.android.material:material:1.11.0")
    implementation("androidx.constraintlayout:constraintlayout:2.1.4")

    if (new File(rootDir, "node_modules/react-native").exists()) {
        implementation("com.facebook.react:react-android")
        implementation("com.facebook.react:hermes-android")
    }
}
